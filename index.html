<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AU Story</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .chat-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            color: #333;
        }
        .message {
            margin: 10px 0;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 75%;
            font-size: 14px;
            line-height: 1.4;
        }
        .left {
            background-color: #e4e6eb;
            color: #000;
            align-self: flex-start;
        }
        .right {
            background-color: #0084ff;
            color: #fff;
            margin-left: auto;
        }
        .sender {
            font-size: 11px;
            color: #777;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">💬 AU Luke & Mick</div>
    <br>
    
    <div>
        <div class="sender">Luke</div>
        <div class="message left">Halo, kamu lagi di mana?</div>
    </div>

    <div>
        <div class="message right">Lagi jalan pulang nih. Kenapa?</div>
    </div>

</div>

</body>
</html>
